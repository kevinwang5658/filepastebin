name = "filepastebin-worker"
main = "src/worker/index.ts"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "ROOMS_KV"
id = "1d58c869234544629300f926892b61bb"
preview_id = "5fdd75224b414057b8335aff7d79e569"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" }
]

routes = [
  { pattern = "filepastebin.com/api/*", zone_name = "filepastebin.com" },
  { pattern = "filepastebin.com/room/*", zone_name = "filepastebin.com" }
]

[[migrations]]
tag = "v1"
new_classes = ["Room"]
